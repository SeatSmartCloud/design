    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      body { margin: 0; background: #f6f0e7; font-family: Inter, system-ui, sans-serif; }
      .pv-switch { display: flex; gap: 6px; justify-content: center; padding: 10px 16px; background: #efe6d9; }
      .pv-switch button { padding: 8px 16px; border: 0; border-radius: 999px; font: 600 13px Inter, system-ui, sans-serif; color: #4a1730; background: transparent; cursor: pointer; }

      .pv-switch button:focus-visible { outline: 2px solid #b8935a; outline-offset: 2px; }
